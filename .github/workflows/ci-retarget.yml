name: CI retarget

on:
  pull_request:
    types: [edited]

permissions:
  actions: write
  pull-requests: read

jobs:
  rerun:
    # UPSYNC2 uses CI's fresh pull_request.edited event and its new merge SHA.
    if: github.event.changes.base && (github.base_ref == 'main' || github.base_ref == 'ao/upsync-design/upsync-integration') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Re-run CI for the new base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            --method GET --paginate -f head_sha="$SHA" -f event=pull_request -F per_page=100 \
            --jq '.workflow_runs[].id')
          id=
          for candidate in $candidates; do
            gh run watch "$candidate" -R "$GITHUB_REPOSITORY" > /dev/null
            # An edited event for this legacy base can create a run with all jobs skipped.
            ran_changes=$(gh run view "$candidate" -R "$GITHUB_REPOSITORY" --json jobs \
              --jq 'any(.jobs[]?; .name == "changes" and .conclusion != "skipped")')
            if [ "$ran_changes" = true ]; then
              id=$candidate
              break
            fi
          done
          if [ -z "$id" ]; then
            echo "No CI run with an eligible changes job for $SHA" >&2
            exit 1
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          [ "$head" = "$SHA" ] || exit 0
          gh run rerun "$id" -R "$GITHUB_REPOSITORY"
